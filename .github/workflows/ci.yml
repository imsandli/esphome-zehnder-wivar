# The same stages as the local hooks (ci/run.sh): lint, host tests, privacy check, config validation and the
# firmware build, with the dummy secrets from ci/secrets.ci.yaml.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ rsync shellcheck
      - name: ESPHome
        run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - name: Build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .ci/work/.esphome
          key: esphome-${{ hashFiles('requirements.txt') }}-${{ github.sha }}
          restore-keys: esphome-${{ hashFiles('requirements.txt') }}-
      - name: CI
        run: ci/run.sh
      - name: Stage logs
        if: failure()
        run: tail -n 100 .ci/*.log

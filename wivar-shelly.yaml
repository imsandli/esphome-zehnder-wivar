# Shelly PM Mini Gen3 (S3PM-001PCEU16) as Zehnder Wivar BLE bridge plus heater power meter.
# Pinout from https://devices.esphome.io/devices/shelly-pm-mini-gen3/
# First flash (not covered by this project): e.g. over the air from Shelly firmware with free-shelly-ota. Later
# updates over Wi-Fi.

substitutions:
  name: wivar-shelly
  friendly_name: Wivar
  wivar_mac: !secret wivar_mac
  wivar_nickname: "ESP-Shelly"
  wivar_components: components   # this checkout, not the GitHub default
  # Above this the heater counts as heating.
  heating_threshold_w: "20"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 8MB
  flash_mode: dio
  # Shelly's own partition layout (from the official 2.0.1 package), so the OTA install from Shelly firmware fits.
  partitions: MiniPMG3-stock.csv
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_PARTITION_TABLE_OFFSET: "0xf000"
    advanced:
      enable_ota_rollback: false

packages:
  wivar: !include common/wivar.yaml

logger:
  logs:
    # One "Found device" line per advertisement in range: dozens per poll with many BLE devices around (smoke
    # alarms, ...). The connection to the remote is logged by esp32_ble_client and stays visible.
    esp32_ble_tracker: INFO

wifi:
  # Both networks, the first preferred: a device that knows only one network is stuck on its fallback
  # hotspot when that one refuses it. Networks entered on the
  # hotspot's page are forgotten with every new build, so they belong here.
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 1
    - ssid: !secret wifi_main_ssid
      password: !secret wifi_main_password
      priority: 0
  # No roaming: every 5 min after connecting ESPHome looked for a stronger access point (up to 3 times), and each roam
  # dropped the API connection without any better signal afterwards. The Shelly doesn't move.
  post_connect_roaming: false
  # Fallback hotspot if the Wi-Fi above can't be joined (e.g. right after the OTA install).
  ap:
    ssid: "Wivar Shelly Fallback"
    password: !secret wivar_shelly_ap_password

captive_portal:

# Web UI at http://<device>/ (states, buttons, logs), behind the login from secrets.yaml.
web_server:
  port: 80
  version: 3
  local: true
  # Digest auth: the password itself never crosses the network, but the page and its data are still plain HTTP.
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password
  # No firmware upload here: captive_portal would enable it, and digest auth can be replayed. Updates go through the
  # encrypted native OTA; the captive portal can still upload while the fallback hotspot is up.
  ota: false
  # Groups instead of one alphabetical list; each entity below names its group and place (sorting_weight).
  sorting_groups:
    - id: room
      name: "Bathroom"
      sorting_weight: 1
    - id: timer
      name: "Heat timer"
      sorting_weight: 2
    - id: schedule
      name: "Schedule"
      sorting_weight: 3
    - id: heater
      name: "Heater"
      sorting_weight: 4
    - id: bridge
      name: "Remote and bridge"
      sorting_weight: 5

# Where the shared entities (common/wivar.yaml) appear in the web UI; merged into their definitions.
zehnder_wivar:
  temperature: {web_server: {sorting_group_id: room, sorting_weight: 1}}
  target_temperature: {web_server: {sorting_group_id: room, sorting_weight: 2}}
  thermostat: {web_server: {sorting_group_id: room, sorting_weight: 3}}
  mode: {web_server: {sorting_group_id: room, sorting_weight: 4}}
  run_mode: {web_server: {sorting_group_id: room, sorting_weight: 5}}
  home_setpoint: {web_server: {sorting_group_id: room, sorting_weight: 6}}
  away_setpoint: {web_server: {sorting_group_id: room, sorting_weight: 7}}
  window_open: {web_server: {sorting_group_id: room, sorting_weight: 8}}
  schedule_today: {web_server: {sorting_group_id: schedule, sorting_weight: 1}}
  next_switch: {web_server: {sorting_group_id: schedule, sorting_weight: 2}}
  schedule: {web_server: {sorting_group_id: schedule, sorting_weight: 3}}
  schedule_write: {web_server: {sorting_group_id: schedule, sorting_weight: 4}}
  overheated: {web_server: {sorting_group_id: heater, sorting_weight: 6}}
  surface_temperature: {web_server: {sorting_group_id: heater, sorting_weight: 7}}
  status: {web_server: {sorting_group_id: bridge, sorting_weight: 1}}
  signal_strength: {web_server: {sorting_group_id: bridge, sorting_weight: 2}}
  battery_low: {web_server: {sorting_group_id: bridge, sorting_weight: 3}}
  error: {web_server: {sorting_group_id: bridge, sorting_weight: 4}}
  room_name: {web_server: {sorting_group_id: bridge, sorting_weight: 5}}
  firmware_version: {web_server: {sorting_group_id: bridge, sorting_weight: 6}}
  firmware_untested: {web_server: {sorting_group_id: bridge, sorting_weight: 7}}
  connections: {web_server: {sorting_group_id: bridge, sorting_weight: 8}}
  connected_time: {web_server: {sorting_group_id: bridge, sorting_weight: 9}}

button:
  - id: !extend btn_refresh
    web_server: {sorting_group_id: room, sorting_weight: 10}
  - id: !extend btn_heat_15min
    web_server: {sorting_group_id: timer, sorting_weight: 2}
  - id: !extend btn_heat_30min
    web_server: {sorting_group_id: timer, sorting_weight: 3}
  - id: !extend btn_heat_45min
    web_server: {sorting_group_id: timer, sorting_weight: 4}
  - id: !extend btn_heat_1h
    web_server: {sorting_group_id: timer, sorting_weight: 5}
  - id: !extend btn_heat_2h
    web_server: {sorting_group_id: timer, sorting_weight: 6}
  - id: !extend btn_heat_4h
    web_server: {sorting_group_id: timer, sorting_weight: 7}
  - id: !extend btn_heat_stop
    web_server: {sorting_group_id: timer, sorting_weight: 8}
  - id: !extend btn_pair
    web_server: {sorting_group_id: bridge, sorting_weight: 12}
  - id: !extend btn_restart
    web_server: {sorting_group_id: bridge, sorting_weight: 13}

text:
  - id: !extend schedule_edit
    web_server: {sorting_group_id: schedule, sorting_weight: 5}

api:
  encryption:
    key: !secret wivar_shelly_api_key

ota:
  - platform: esphome
    # Uploads are encrypted and authenticated with the API key (no separate OTA password).
    encryption: {}

status_led:
  pin:
    number: GPIO0
    inverted: true

# ── Power meter (BL0942) ────────────────────────────────────────────────────
uart:
  id: bl0942_uart
  tx_pin: GPIO6
  # Without the pull-up the idle line reads stray 0x00/0xFE bytes around every reply and no checksum matches.
  rx_pin:
    number: GPIO7
    mode:
      input: true
      pullup: true
  baud_rate: 9600
  stop_bits: 1

sensor:
  - id: !extend timer_remaining
    web_server: {sorting_group_id: timer, sorting_weight: 1}
  - platform: bl0942
    uart_id: bl0942_uart
    update_interval: 5s
    # Voltage: calibrated against a reference meter; ESPHome's default (15883) read about 10% low, the Shelly
    # firmware about 2% low. Current and power keep the defaults: the heater's steady power matched the Shelly
    # firmware's history within about 1%.
    voltage_reference: 14357
    voltage:
      name: "Heater voltage"
      web_server: {sorting_group_id: heater, sorting_weight: 3}
      entity_category: diagnostic
    current:
      name: "Heater current"
      web_server: {sorting_group_id: heater, sorting_weight: 4}
      entity_category: diagnostic
    power:
      name: "Heater power"
      web_server: {sorting_group_id: heater, sorting_weight: 1}
      id: heater_power
      filters:
        # Small negative/noise readings when idle.
        - lambda: |-
            return x < 1.0f ? 0.0f : x;
    energy:
      name: "Heater energy"
      web_server: {sorting_group_id: heater, sorting_weight: 2}
    frequency:
      name: "Mains frequency"
      web_server: {sorting_group_id: heater, sorting_weight: 5}
      entity_category: diagnostic

  # Board temperature (NTC on GPIO3), like the stock firmware's device temperature.
  - platform: adc
    id: ntc_voltage
    pin: GPIO3
    attenuation: 12db
    update_interval: 60s
    internal: true
  - platform: resistance
    id: ntc_resistance
    sensor: ntc_voltage
    configuration: DOWNSTREAM
    resistor: 10kOhm
    internal: true
  - platform: ntc
    sensor: ntc_resistance
    name: "Shelly temperature"
    web_server: {sorting_group_id: bridge, sorting_weight: 11}
    entity_category: diagnostic
    calibration:
      b_constant: 3350
      reference_resistance: 10kOhm
      reference_temperature: 298.15K

  - platform: wifi_signal
    name: "WiFi signal"
    web_server: {sorting_group_id: bridge, sorting_weight: 10}
    update_interval: 60s

binary_sensor:
  # The remote never says whether the heater runs; the power meter does.
  - platform: template
    name: "Heating"
    web_server: {sorting_group_id: room, sorting_weight: 9}
    device_class: heat
    lambda: return id(heater_power).state > ${heating_threshold_w};
    filters:
      - delayed_off: 30s

  # Button on the Shelly: short press = poll now, hold 3 s = pair with the remote.
  - platform: gpio
    id: shelly_button
    internal: true
    pin:
      number: GPIO1
      inverted: true
      mode: INPUT_PULLUP
    on_click:
      - min_length: 50ms
        max_length: 1s
        then:
          - lambda: id(wivar).refresh();
      - min_length: 3s
        max_length: 20s
        then:
          - lambda: id(wivar).start_pairing();
